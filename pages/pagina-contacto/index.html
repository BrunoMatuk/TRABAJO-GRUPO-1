<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - AppleZone</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
 
  <link rel="stylesheet" href="styles.css">
</head>
<body>

 
  <section class="contacto-section py-5 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="container">
      <div class="row justify-content-center">
        
        <div class="col-lg-8">
          <div class="glass-box p-5 rounded-4 shadow-lg text-center">
            <h1 class="fw-bold text-white mb-4">📩 Contáctanos</h1>
            
           
            <form>
              <div class="mb-3 text-start">
                <label for="nombre" class="form-label text-white">Nombre</label>
                <input type="text" class="form-control rounded-pill" id="nombre" placeholder="Tu nombre">
              </div>

              <div class="mb-3 text-start">
                <label for="email" class="form-label text-white">Correo</label>
                <input type="email" class="form-control rounded-pill" id="email" placeholder="ejemplo@correo.com">
              </div>

              <div class="mb-3 text-start">
                <label for="mensaje" class="form-label text-white">Mensaje</label>
                <textarea class="form-control rounded-4" id="mensaje" rows="5" placeholder="Escribe tu mensaje..."></textarea>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-gradient px-4 py-2 rounded-pill shadow-sm">Enviar</button>
              </div>
            </form>

            
            <hr class="my-5 text-white">

          
            <div class="text-white mb-4">
              <p><i class="bi bi-geo-alt-fill me-2"></i>Av. Principal 123, Buenos Aires, Argentina</p>
              <p><i class="bi bi-telephone-fill me-2"></i>+54 11 5555-5555</p>
              <p><i class="bi bi-envelope-fill me-2"></i>contacto@applezone.com</p>
            </div>

           
            <div class="d-flex justify-content-center gap-3">
              <a href="#" class="btn btn-outline-light rounded-circle"><i class="bi bi-facebook"></i></a>
              <a href="#" class="btn btn-outline-light rounded-circle"><i class="bi bi-instagram"></i></a>
              <a href="#" class="btn btn-outline-light rounded-circle"><i class="bi bi-twitter-x"></i></a>
              <a href="#" class="btn btn-outline-light rounded-circle"><i class="bi bi-whatsapp"></i></a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
